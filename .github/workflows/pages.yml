# Builds and checks the site on every push and pull request.
#
# Hosting:
#  - Cloudflare Pages (recommended): Cloudflare builds the site itself from
#    this repository; see README.md. Once it is live there, go to
#    Settings → Secrets and variables → Actions → Variables and add
#    DEPLOY_TARGET = cloudflare, so this workflow stops publishing to GitHub Pages.
#  - GitHub Pages (current): pushes to main are published to GitHub Pages
#    automatically, as before.
name: Build site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install
        run: npm ci
      - name: Test the contact form function
        run: npm run test:contact
      - name: Build
        run: npm run build
      - name: Upload site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_TARGET != 'cloudflare'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_TARGET != 'cloudflare'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
