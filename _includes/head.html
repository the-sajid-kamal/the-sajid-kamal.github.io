<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  /* Runs before the page is drawn: notes that JavaScript works, and applies a
     palette picked in the owner preview (add ?preview to any address). */
  (function (doc) {
    doc.documentElement.classList.add('js');
    try {
      var query = new URLSearchParams(location.search);
      var saved = JSON.parse(sessionStorage.getItem('owner-preview') || '{}');
      var palette = query.get('palette') || (saved.on && saved.palette);
      if (palette) doc.documentElement.setAttribute('data-palette', palette);
    } catch (e) {}
  })(document);
</script>
