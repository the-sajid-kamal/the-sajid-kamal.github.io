{%- assign post = include.post -%}
<article class="post-row" data-reveal>
  <a class="post-row__link" href="{{ post.url | relative_url }}">
    <time class="post-row__date" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%-d %b %Y" }}</time>
    <div class="post-row__main">
      <h3 class="post-row__title">{{ post.title }}</h3>
      {%- assign excerpt = post.excerpt | strip_html | strip %}
      <p class="post-row__excerpt{% if excerpt contains '[Placeholder' %} placeholder{% endif %}">{{ excerpt | truncate: 220 }}</p>
    </div>
    <p class="post-row__meta">{{ post.topic }}<br>{% include reading-time.html content=post.content %}</p>
  </a>
</article>
