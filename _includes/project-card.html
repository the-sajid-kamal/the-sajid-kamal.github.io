{%- assign p = include.project -%}
<article class="project-card" data-category="{{ p.category | slugify }}" data-reveal>
  <a class="project-card__link" href="{{ p.url | relative_url }}">
    <div class="project-card__media">
      <img src="{{ p.cover | default: '/assets/img/placeholders/project-cover.svg' | relative_url }}" alt="{{ p.cover_alt }}" width="1600" height="1000" loading="lazy" decoding="async"{% if p.cover == nil or p.cover contains 'placeholder' %} data-placeholder{% endif %}>
    </div>
    <div class="project-card__body">
      <p class="meta">{{ p.client }} <span aria-hidden="true">·</span> {{ p.year }} <span aria-hidden="true">·</span> {{ p.category }}</p>
      <h3 class="project-card__title">{{ p.title }}</h3>
      <p class="project-card__summary">{{ p.summary }}</p>
      <span class="link-arrow">Read the case study <span class="arrow" aria-hidden="true">→</span></span>
    </div>
  </a>
</article>
