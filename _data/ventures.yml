# "Building and giving back" on the About page. Taken from the CV.

- role: Founder (alongside full-time work)
  company: Sui Chokri
  dates: Nov 2023 – May 2024
  highlights:
    - "An “Uber for tailor shops”: a distributed clothing production network connecting neighbourhood tailors to customers and indie brands through centrally managed hubs."
    - "Selected for the Needle Innovation Challenge (Oporajita initiative of the H&M Foundation, supported by Sweden and The Asia Foundation) and awarded a pollination grant to pilot the model."
    - "Onboarded 156 tailor shops in Mohammadpur, Mirpur and Rampura, then tested and pivoted the model before operations closed in May 2024."

- role: Trainer and Team Leader (part-time)
  company: Criticalink
  dates: Feb 2017 – Dec 2019
  highlights:
