# ---------------------------------------------------------------------
#  Search engines and link previews (used by jekyll-seo-tag)
# ---------------------------------------------------------------------
# The image shown when a page is shared on LinkedIn, WhatsApp, Facebook...
# is set under "defaults" below (image: /assets/img/share-card.png).
# It must be 1200 x 630 pixels, PNG or JPG. A single page can use its own
# by adding an "image:" line to its front matter.
social:
  name: Sajid Kamal
  links:
    - https://www.linkedin.com/in/sajid-kamal/
    - https://www.facebook.com/mohammad.sajid.kamal/
    - https://github.com/the-sajid-kamal

# =====================================================================
#  Technical settings - you normally don't need to touch anything below
# =====================================================================

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Articles live in _posts/ and appear at /writing/<title>/
permalink: /writing/:title/

# Projects live in _projects/ and appear at /work/<file-name>/
collections:
  projects:
    output: true
    permalink: /work/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/img/share-card.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      body_class: page-article
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      body_class: page-project

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: writing/feed.xml

exclude:
  - README.md
  - CONTENT-GUIDE.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
