# =====================================================================
#  Site settings
#  The things you are most likely to want to change are at the top.
#  GitHub rebuilds the site automatically after every change.
#  (Text after a # is a note and is ignored.)
# =====================================================================

title: Sajid Kamal
tagline: FMCG brand strategist in Dhaka
description: >-
  Sajid Kamal is an FMCG brand strategist and Brand Manager at Ghorer Bazar
  in Dhaka. Projects, essays and lessons from building food and beauty
  brands in Bangladesh.
url: "https://thesajidkamal.me"
baseurl: ""
lang: en
timezone: Asia/Dhaka

# Colour palette for the whole site.
# Options: terracotta (default) | bottle | indigo | ink
# To preview them all before choosing, open the site with ?preview at the end
# of the address, e.g. https://thesajidkamal.me/?preview
palette: terracotta

author:
  name: Sajid Kamal
  full_name: MD Sajid Kamal
  role: Brand Manager, Ghorer Bazar
  # Small round photo shown under articles. Replace with your own headshot.
